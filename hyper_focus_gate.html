<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyper Focus 승인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
    body{font-family:"Pretendard",sans-serif}
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <main class="min-h-screen grid place-items-center p-6">
    <section class="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900/90 p-8">
      <h1 class="text-2xl font-black">Hyper Focus 진입 승인</h1>
      <p class="mt-2 text-sm text-slate-300">승인번호를 확인한 뒤 외부 학습 페이지로 이동합니다.</p>

      <div class="mt-6 space-y-3">
        <label for="code" class="text-xs font-bold text-slate-300">승인번호</label>
        <input id="code" type="password" inputmode="numeric" class="w-full rounded-xl border border-slate-600 bg-slate-800 px-4 py-3 outline-none focus:border-amber-400" placeholder="승인번호 입력">
        <button id="goBtn" class="w-full rounded-xl bg-gradient-to-r from-amber-300 to-yellow-500 text-slate-900 py-3 font-black">승인 후 이동</button>
      </div>
      <p id="errorMsg" class="h-5 mt-3 text-sm text-red-300"></p>
    </section>
  </main>

  <script>
    const APPROVAL_CODE = "777200";
    const DEST = "https://docssam1.github.io/Hyper-Focus-answer-Key/";

    function go() {
      const code = document.getElementById("code").value.trim();
      const err = document.getElementById("errorMsg");
      if (code !== APPROVAL_CODE) {
        err.textContent = "승인번호가 일치하지 않습니다.";
        return;
      }
      err.textContent = "";
      window.location.href = DEST;
    }

    document.getElementById("goBtn").addEventListener("click", go);
    document.getElementById("code").addEventListener("keydown", (e) => {
      if (e.key === "Enter") go();
    });
  </script>
</body>
</html>
