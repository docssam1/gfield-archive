<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GFIELD-ON | Intro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
    body{font-family:"Pretendard",sans-serif}
    .story-line{animation:storyUp .7s ease both}
    .story-line:nth-child(2){animation-delay:.18s}
    .story-line:nth-child(3){animation-delay:.36s}
    .story-line:nth-child(4){animation-delay:.54s}
    @keyframes storyUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <main class="min-h-screen grid place-items-center p-6 bg-[radial-gradient(circle_at_top_left,rgba(251,191,36,.16),transparent_32%),radial-gradient(circle_at_top_right,rgba(96,165,250,.16),transparent_34%)]">
    <section class="w-full max-w-3xl rounded-[2rem] border border-slate-700 bg-slate-900/80 backdrop-blur p-7 md:p-10 text-center shadow-2xl shadow-black/40">
      <img src="logo.png" alt="GFIELD 로고" class="h-14 mx-auto mb-5">

      <div class="mb-7 text-left md:text-center">
        <p class="story-line text-amber-200 text-sm md:text-base font-black tracking-[.22em]">쉿,</p>
        <h1 class="story-line mt-3 text-4xl md:text-6xl font-black tracking-[-.08em] leading-none">
          GFIELD-ON
        </h1>
        <p class="story-line mt-5 text-2xl md:text-4xl font-black tracking-[-.06em] leading-tight">
          우리 아이의 교재가<br class="md:hidden"> 온라인 서재로 열립니다.
        </p>
        <p class="story-line mt-5 text-sm md:text-lg text-slate-300 leading-8 tracking-[-.02em]">
          지필드 영재교육의 교재, 풀이 영상, 학습 기록이<br class="hidden md:block">
          한 학생의 이름 아래 차곡차곡 연결됩니다.
        </p>
      </div>

      <div class="mb-7 rounded-3xl border border-amber-200/20 bg-gradient-to-r from-amber-200/10 via-white/5 to-blue-300/10 p-5 text-left">
        <p class="text-sm md:text-base text-slate-200 leading-7 font-bold tracking-[-.03em]">
          매년 쌓인 결과는 숫자로 남고,<br>
          그 숫자는 다시 한 아이의 공부 습관으로 이어집니다.
        </p>
        <p class="mt-3 text-xs md:text-sm text-slate-400 leading-6">
          이름을 입력하면 학생별 서재로 입장합니다.
        </p>
      </div>

      <div class="mt-6 space-y-3 text-left max-w-md mx-auto">
        <label class="text-xs font-bold text-slate-300">학생 이름</label>
        <input id="studentName" class="w-full rounded-xl border border-slate-600 bg-slate-800 px-4 py-3 outline-none focus:border-amber-400" placeholder="이름 입력">
        <button id="enterBtn" class="w-full rounded-xl bg-gradient-to-r from-amber-300 to-yellow-500 text-slate-900 py-3 font-black">서재 입장</button>
      </div>
      <p id="errorMsg" class="h-5 mt-3 text-sm text-red-300"></p>
    </section>
  </main>
  <script>
    function enter(){
      const name = document.getElementById("studentName").value.trim();
      const err = document.getElementById("errorMsg");
      if(!name){ err.textContent = "이름을 입력해주세요."; return; }
      sessionStorage.setItem("gfield_student_name", name);
      location.href = "library.html";
    }
    document.getElementById("enterBtn").addEventListener("click", enter);
    document.getElementById("studentName").addEventListener("keydown", (e)=>{ if(e.key==="Enter") enter(); });
  </script>
</body>
</html>
