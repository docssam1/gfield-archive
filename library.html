<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GFIELD-ON | Archive Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
    :root{--brand:#16417c;--ink:#111827;--line:#e5e7eb;--muted:#64748b;--gold:#d4af37}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Pretendard",system-ui,sans-serif;background:#f8fafc;color:var(--ink)}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .shell{width:min(1180px,100%);margin:0 auto;padding:0 22px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand img{height:32px;width:auto}
    .brand strong{font-size:15px;letter-spacing:.02em}
    .hero{padding:34px 0 26px;border-bottom:1px solid #edf2f7;background:linear-gradient(180deg,#fff,#f8fafc)}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:end}
    .eyebrow{font-size:12px;font-weight:1000;letter-spacing:.22em;color:var(--brand)}
    .hero h1{margin:10px 0 0;font-size:clamp(32px,5vw,58px);line-height:1.05;letter-spacing:-.055em}
    .hero p{margin:16px 0 0;color:#475569;font-size:16px;line-height:1.75}
    .status-panel{border:1px solid var(--line);background:white;border-radius:8px;padding:18px;box-shadow:0 12px 36px rgba(15,23,42,.06)}
    .status-panel small{display:block;color:var(--muted);font-weight:800}
    .status-panel b{display:block;margin-top:6px;font-size:22px;letter-spacing:-.04em}
    .toolbar{padding:22px 0;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
    .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
    .filter-btn{height:38px;white-space:nowrap;border:1px solid #cbd5e1;background:white;color:#475569;border-radius:999px;padding:0 14px;font-size:13px;font-weight:900;cursor:pointer}
    .filter-btn.active{background:#0f172a;color:white;border-color:#0f172a}
    .search{position:relative;min-width:240px}
    .search input{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:999px;background:white;padding:0 42px 0 15px;font-weight:700;outline:none}
    .search i{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#64748b}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:70px}
    .card{display:flex;flex-direction:column;min-height:430px;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 8px 26px rgba(15,23,42,.055);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(15,23,42,.1);border-color:#cbd5e1}
    .cover{position:relative;aspect-ratio:3/4;background:#e2e8f0;overflow:hidden}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .cover-fallback{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#eef2f7,#dbe5ef);color:#475569;text-align:center;padding:22px}
    .cover-fallback strong{font-size:20px;line-height:1.35;letter-spacing:-.04em}
    .type-ribbon{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;height:30px;border-radius:999px;background:rgba(15,23,42,.84);color:white;padding:0 10px;font-size:12px;font-weight:1000;backdrop-filter:blur(10px)}
    .body{display:flex;flex-direction:column;gap:12px;flex:1;padding:18px}
    .meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .category{font-size:12px;font-weight:1000;color:var(--brand)}
    .level{font-size:12px;font-weight:900;color:#64748b}
    .title{font-size:20px;font-weight:1000;line-height:1.35;letter-spacing:-.045em}
    .desc{min-height:44px;color:#64748b;font-size:14px;line-height:1.6}
    .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
    .badge{display:inline-flex;align-items:center;gap:5px;height:26px;border-radius:999px;border:1px solid #e2e8f0;background:#f8fafc;padding:0 9px;font-size:11px;font-weight:1000;color:#334155}
    .badge.video{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
    .badge.ai{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
    .badge.diagnostic{background:#ecfeff;color:#0e7490;border-color:#a5f3fc}
    .badge.premium{background:#fffbeb;color:#92400e;border-color:#fde68a}
    .empty{grid-column:1/-1;border:1px dashed #cbd5e1;border-radius:8px;background:white;padding:54px 24px;text-align:center;color:#64748b}
    @media(max-width:980px){.hero-grid{grid-template-columns:1fr}.status-panel{max-width:420px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:680px){.shell{padding:0 16px}.toolbar{grid-template-columns:1fr}.search{min-width:0}.grid{grid-template-columns:1fr}.card{min-height:auto}.topbar .shell{padding-top:12px;padding-bottom:12px}.brand strong{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell flex items-center justify-between py-4 gap-4">
      <a class="brand text-inherit no-underline" href="index.html">
        <img src="logo.png" alt="GFIELD">
        <strong>GFIELD-ON ARCHIVE</strong>
      </a>
      <div class="text-sm font-black text-slate-600 bg-slate-100 border border-slate-200 rounded-full px-4 py-2">
        <i class="fa-solid fa-circle-user mr-1"></i>
        <span id="profileName">승인 사용자</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="shell hero-grid">
      <div>
        <div class="eyebrow">ARCHIVE LIBRARY</div>
        <h1>지필드의 자료가<br>한곳에 정리되는 서재</h1>
        <p>
          교재, 영상강의, 설명회, 공지, 프리미엄 자료까지 한 화면에서 찾을 수 있도록
          GFIELD-ON 자료실 허브를 먼저 안정적으로 구성합니다.
        </p>
      </div>
      <aside class="status-panel">
        <small>오늘의 자료실</small>
        <b id="libraryCount">0개 자료</b>
        <small class="mt-3">영상/eBook/AI튜터/진단평가 표시 지원</small>
      </aside>
    </div>
  </section>

  <main class="shell">
    <section class="toolbar" aria-label="자료 필터">
      <div class="filters" id="filters"></div>
      <label class="search">
        <input id="searchInput" type="search" placeholder="자료명 검색">
        <i class="fa-solid fa-magnifying-glass"></i>
      </label>
    </section>
    <section id="libraryGrid" class="grid" aria-live="polite"></section>
  </main>

  <script>
    if (sessionStorage.getItem("gfield_approved") !== "true") {
      location.href = "index.html";
    }

    const profileName = sessionStorage.getItem("gfield_student_name") || "승인 사용자";
    document.getElementById("profileName").textContent = profileName;

    const FILTERS = [
      ["all", "전체"],
      ["ebook", "교재"],
      ["video", "영상"],
      ["seminar", "설명회"],
      ["notice", "공지"],
      ["zoom", "줌수업"],
      ["premium", "프리미엄"]
    ];

    const TYPE_META = {
      ebook: { label: "eBook", icon: "fa-book-open" },
      video: { label: "영상강의", icon: "fa-circle-play" },
      seminar: { label: "설명회", icon: "fa-chalkboard-user" },
      notice: { label: "공지", icon: "fa-bullhorn" },
      zoom: { label: "줌수업", icon: "fa-video" },
      premium: { label: "프리미엄", icon: "fa-crown" }
    };

    let materialsData = [];
    let currentFilter = "all";

    async function fetchJsonSafe(url) {
      try {
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) return { ok: false, reason: "http_error", status: res.status, data: null };
        const contentType = (res.headers.get("content-type") || "").toLowerCase();
        if (!contentType.includes("application/json")) {
          const raw = await res.text();
          return { ok: false, reason: "non_json", status: res.status, data: null, rawHead: raw.slice(0, 120) };
        }
        return { ok: true, reason: "ok", status: res.status, data: await res.json() };
      } catch (_err) {
        return { ok: false, reason: "network_error", status: 0, data: null };
      }
    }

    function fallbackMaterials() {
      return [
        {
          id: "sample_hwangso",
          title: "황소 실전 모의고사 샘플",
          display_name: "황소 실전 모의고사 샘플",
          category: "hwangso",
          categoryLabel: "황소 대비",
          level: "G6",
          type: "video",
          desc: "영상강의와 eBook을 함께 보는 샘플 자료입니다.",
          targetUrl: "premier_archive.html",
          features: { aiTutor: true, diagnostic: false },
          thumbnail_path: ""
        },
        {
          id: "sample_premier",
          title: "프리미어 창의사고 샘플",
          display_name: "프리미어 창의사고 샘플",
          category: "premier",
          categoryLabel: "프리미어",
          level: "초등",
          type: "ebook",
          desc: "영상 없이 넓은 eBook 모드로 보는 샘플 자료입니다.",
          targetUrl: "premier_archive.html",
          features: { aiTutor: true, diagnostic: true },
          thumbnail_path: ""
        },
        {
          id: "sample_seminar",
          title: "입시 설명회 다시보기",
          display_name: "입시 설명회 다시보기",
          category: "seminar",
          categoryLabel: "설명회",
          level: "학부모",
          type: "seminar",
          desc: "학부모 안내 영상과 설명회 자료가 들어갈 자리입니다.",
          targetUrl: "premier_archive.html",
          features: { aiTutor: false, diagnostic: false, premium: false },
          thumbnail_path: ""
        },
        {
          id: "sample_zoom",
          title: "줌수업 안내",
          display_name: "줌수업 안내",
          category: "zoom",
          categoryLabel: "라이브",
          level: "예정",
          type: "zoom",
          desc: "향후 유료 라이브 수업 안내와 신청 동선을 연결합니다.",
          targetUrl: "premier_archive.html",
          features: { premium: true },
          thumbnail_path: ""
        }
      ];
    }

    function renderFilters() {
      const holder = document.getElementById("filters");
      holder.innerHTML = FILTERS.map(([key, label]) => `
        <button class="filter-btn ${key === currentFilter ? "active" : ""}" data-filter="${key}" type="button">${label}</button>
      `).join("");
      holder.addEventListener("click", (event) => {
        const btn = event.target.closest(".filter-btn");
        if (!btn) return;
        currentFilter = btn.dataset.filter;
        renderFilters();
        renderLibrary();
      }, { once: true });
    }

    function normalizeItem(item) {
      const type = item.type || "ebook";
      const title = item.display_name || item.title || item.name || "이름 없는 자료";
      return {
        ...item,
        type,
        title,
        targetUrl: item.targetUrl || `premier_archive.html?id=${encodeURIComponent(item.id || title)}`,
        categoryLabel: item.categoryLabel || item.category || "자료",
        desc: item.desc || item.description || "",
        features: item.features || {}
      };
    }

    function typeBadge(type) {
      const meta = TYPE_META[type] || TYPE_META.ebook;
      return `<span class="type-ribbon"><i class="fa-solid ${meta.icon}"></i>${meta.label}</span>`;
    }

    function featureBadges(item) {
      const badges = [];
      if (item.type === "video" || item.lectures?.length) badges.push('<span class="badge video"><i class="fa-solid fa-play"></i>영상강의</span>');
      if (item.features?.aiTutor) badges.push('<span class="badge ai"><i class="fa-solid fa-sparkles"></i>AI 튜터</span>');
      if (item.features?.diagnostic) badges.push('<span class="badge diagnostic"><i class="fa-solid fa-chart-simple"></i>진단평가</span>');
      if (item.features?.premium || item.type === "premium" || item.type === "zoom") badges.push('<span class="badge premium"><i class="fa-solid fa-crown"></i>프리미엄</span>');
      if (!badges.length) badges.push('<span class="badge"><i class="fa-solid fa-folder"></i>자료</span>');
      return badges.join("");
    }

    function renderLibrary() {
      const grid = document.getElementById("libraryGrid");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const rows = materialsData
        .map(normalizeItem)
        .filter((item) => currentFilter === "all" || item.type === currentFilter || item.category === currentFilter)
        .filter((item) => !query || `${item.title} ${item.categoryLabel} ${item.desc}`.toLowerCase().includes(query));

      document.getElementById("libraryCount").textContent = `${rows.length}개 자료`;

      if (!rows.length) {
        grid.innerHTML = '<div class="empty"><strong>표시할 자료가 없습니다.</strong><br>필터나 검색어를 조정해 주세요.</div>';
        return;
      }

      grid.innerHTML = rows.map((item) => {
        const thumb = item.thumbnail_path
          ? `<img src="${item.thumbnail_path}" alt="${item.title}">`
          : `<div class="cover-fallback"><strong>${item.title}</strong></div>`;
        return `
          <a class="card" href="${item.targetUrl}">
            <div class="cover">
              ${thumb}
              ${typeBadge(item.type)}
            </div>
            <div class="body">
              <div class="meta">
                <span class="category">${item.categoryLabel}</span>
                <span class="level">${item.level || ""}</span>
              </div>
              <div class="title">${item.title}</div>
              <p class="desc">${item.desc}</p>
              <div class="badges">${featureBadges(item)}</div>
            </div>
          </a>
        `;
      }).join("");
    }

    async function loadMaterials() {
      const result = await fetchJsonSafe("materials.json?cache_bust=" + Date.now());
      materialsData = result.ok && Array.isArray(result.data) ? result.data : fallbackMaterials();
      if (!result.ok) console.info("[GFIELD] materials fallback:", result.reason, result.status);
      renderFilters();
      renderLibrary();
    }

    document.getElementById("searchInput").addEventListener("input", renderLibrary);
    loadMaterials();
  </script>
</body>
</html>
